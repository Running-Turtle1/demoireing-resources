[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbcnn-pytorch"
version = "0.1.0"
description = "A standalone PyTorch extraction of MBCNN for image demoireing"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "4DVLab" },
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "torch>=2.0",
  "tqdm>=4.65",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]
lpips = ["lpips>=0.1.4", "torchvision>=0.15"]

[project.urls]
Paper = "https://arxiv.org/abs/2004.00406"
"Reference implementation" = "https://github.com/zhenngbolun/Learnbale_Bandpass_Filter"
Source = "https://github.com/4DVLab/UniDemoire"

[tool.setuptools.packages.find]
include = ["mbcnn*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
